[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lvimot"
version = "2026.10.22"
requires-python = ">=3.8"
description = "Sensor-only LVIMOT estimation and 4D mapping"

[tool.setuptools.packages.find]
include = ["lvimot*", "tools*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
